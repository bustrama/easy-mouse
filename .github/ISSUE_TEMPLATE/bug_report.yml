name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. Use the "Report a vulnerability" button on the Security tab (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Easy Mouse version
      description: Shown in Settings > About.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and browser
      placeholder: Pixel 8, Chrome 130
  - type: dropdown
    id: network
    attributes:
      label: Windows network profile
      options: ["Private", "Public", "Not sure"]
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots are welcome. Do not paste pairing links or QR codes.
