name: ci-dotnet

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/ci-dotnet.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/ci-dotnet.yml"

permissions:
  contents: read

concurrency:
  group: ci-dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Fail on vulnerable packages
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Lock files unchanged after restore
        shell: bash
        run: git diff --exit-code -- '**/packages.lock.json'

      - name: Set up Node (for the independent vector check)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Verify tests/vectors.json with Node's crypto
        run: node tests/verify-vectors.mjs tests/vectors.json
