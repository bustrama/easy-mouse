name: ci-remotes

on:
  push:
    branches: [main]
    paths:
      - "remotes/**"
      - "src/Remotes/**"
      - "tools/RemoteLint/**"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/ci-remotes.yml"
  pull_request:
    paths:
      - "remotes/**"
      - "src/Remotes/**"
      - "tools/RemoteLint/**"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/ci-remotes.yml"

permissions:
  contents: read

concurrency:
  group: ci-remotes-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore tools/RemoteLint --locked-mode

      - name: Build RemoteLint
        run: dotnet build tools/RemoteLint --no-restore --configuration Release

      # Validates remotes/**/*.json with the same strict validator the app uses and prints every sensitive
      # and dangerous action (as warnings on the PR) so a reviewer sees what a community remote can do.
      - name: Lint remotes
        run: dotnet run --project tools/RemoteLint --no-build --configuration Release -- remotes
