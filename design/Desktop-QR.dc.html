<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easy Mouse QR window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Heebo',system-ui,sans-serif}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.rng{animation:ring 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.rng{animation:none}}
</style>
</helmet>
<div style="width:440px;height:640px;box-sizing:border-box;background:#0E1116;color:#F3F5F7;display:flex;flex-direction:column;border:1px solid #2A323E">
<div style="height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;font-size:13px;font-weight:500;color:#C9D1DC">
<div style="display:flex;align-items:center;gap:8px"><div style="width:18px;height:18px;border-radius:6px;background:#2563EB"></div>Easy Mouse</div>
<div style="display:flex;gap:2px"><div style="width:40px;height:32px"></div><div style="width:40px;height:32px"></div></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 36px 28px;gap:0">
<h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.6px;text-align:center">Scan to connect your phone</h1>
<p style="margin:8px 0 0;font-size:15px;line-height:1.5;color:#C9D1DC;text-align:center">Open the camera on your phone and point it at this code.</p>
<div style="margin-top:24px;position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center">
<div class="rng" style="position:absolute;inset:0;border-radius:28px;border:2px solid #5B8CFF"></div>
<div style="position:relative;width:260px;height:260px;background:#fff;border-radius:24px;border:1px solid #2A323E;padding:18px;box-sizing:border-box;box-shadow:0 10px 30px rgba(14,17,22,.08)">
<div style="display:grid;grid-template-columns:repeat(21,minmax(0,1fr));width:100%;height:100%">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="441"><div style="background:{{c.bg}}"></div></sc-for>
</div>
</div>
</div>
<div style="margin-top:22px;display:flex;align-items:center;gap:8px;background:#E3ECFF;color:#1747B8;padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700">
<span style="width:8px;height:8px;border-radius:50%;background:#2563EB"></span>Waiting for a phone
</div>
<div style="margin-top:14px;font-size:13px;color:#9AA4B2">Code is valid for 1:48</div>
<div style="margin-top:6px;font-size:13px;color:#9AA4B2;direction:ltr">http://office-pc.local:8765</div>
<div style="flex:1"></div>
<div style="width:100%;display:flex;gap:10px">
<button style="flex:1;height:44px;border-radius:12px;border:1px solid #2A323E;background:#171C24;font:inherit;font-size:15px;font-weight:700;color:#F3F5F7">New code</button>
<button style="flex:1;height:44px;border-radius:12px;border:1px solid #2A323E;background:#171C24;font:inherit;font-size:15px;font-weight:700;color:#F3F5F7">Settings</button>
</div>
<div style="margin-top:14px;font-size:12px;color:#9AA4B2;text-align:center">Paired phones reconnect on their own. Closing this window keeps Easy Mouse in the tray.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const N = 21, cells = [];
const finder = (r, c) => {
for (const [br, bc] of [[0,0],[0,N-7],[N-7,0]]) {
const rr = r - br, cc = c - bc;
if (rr >= 0 && rr < 7 && cc >= 0 && cc < 7) {
return (rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4)) ? 1 : 0;
}
}
return null;
};
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
let v = finder(r, c);
if (v === null) v = ((r * 7 + c * 13 + r * c) % 5 < 2) ? 1 : 0;
cells.push({ bg: v ? '#0E1116' : '#fff' });
}
return { cells };
}
}
</script>
</body>
</html>
