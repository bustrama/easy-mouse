<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone remotes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&amp;display=swap">
<style>body{margin:0;font-family:'Heebo',system-ui,sans-serif}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1116;color:#F3F5F7;display:flex;flex-direction:column;padding:56px 16px 0">
<div style="display:flex;justify-content:space-between;align-items:center;height:44px">
<div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700"><span style="width:9px;height:9px;border-radius:50%;background:#4ADE80"></span>Office PC</div>
<div style="font-size:13px;font-weight:700;color:#9AA4B2">Remotes</div>
</div>
<div style="margin-top:14px;display:flex;gap:8px;overflow:hidden">
<div style="padding:8px 16px;border-radius:999px;border:1px solid #2A323E;color:#C9D1DC;font-size:14px;font-weight:700;white-space:nowrap">Plex</div>
<div style="padding:8px 16px;border-radius:999px;background:#E3ECFF;color:#1747B8;font-size:14px;font-weight:700;white-space:nowrap">Stremio</div>
<div style="padding:8px 16px;border-radius:999px;border:1px solid #2A323E;color:#C9D1DC;font-size:14px;font-weight:700;white-space:nowrap">Movie night</div>
<div style="padding:8px 16px;border-radius:999px;border:1px dashed #3A4452;color:#9AA4B2;font-size:14px;font-weight:700;white-space:nowrap">+ New</div>
</div>
<div style="margin-top:20px;background:#171C24;border:1px solid #2A323E;border-radius:20px;padding:16px">
<div style="font-size:12px;font-weight:700;color:#9AA4B2">Now playing</div>
<div style="margin-top:2px;font-size:18px;font-weight:700">The Bear · S3 E4</div>
</div>
<div style="margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{buttons}}" as="b" hint-placeholder-count="6">
<button style="height:84px;border-radius:20px;border:1px solid {{b.bd}};background:{{b.bg}};font:inherit;font-size:16px;font-weight:700;color:#F3F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3F5F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"/></svg>{{b.label}}
</button>
</sc-for>
</div>
<div style="margin-top:12px;background:#171C24;border:1px solid #2A323E;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px">
<span style="font-size:14px;font-weight:700;color:#C9D1DC">Volume</span>
<div style="flex:1;height:8px;border-radius:4px;background:#2A323E;position:relative"><div style="width:48%;height:8px;border-radius:4px;background:#5B8CFF"></div><div style="position:absolute;left:48%;top:-8px;width:24px;height:24px;border-radius:50%;background:#fff;margin-left:-12px"></div></div>
</div>
<button style="margin-top:12px;height:48px;border-radius:14px;border:1px solid #2A323E;background:transparent;font:inherit;font-size:15px;font-weight:700;color:#C9D1DC">Edit this remote</button>
<div style="flex:1"></div>
<div style="height:84px;border-top:1px solid #2A323E;display:flex;padding-top:8px;padding-bottom:20px;box-sizing:border-box">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:{{t.fg}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"/></svg>{{t.label}}
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const t = [
['Mouse', 'M12 3v18M3 12h18'],
['Keyboard', 'M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8'],
['Media', 'M8 5v14l11-7z'],
['Remotes', 'M4 6h16M4 12h16M4 18h10']
];
const b = (label, d, main) => ({ label, d, bg: main ? '#2563EB' : '#171C24', bd: main ? '#2563EB' : '#2A323E' });
return {
tabs: t.map(([label, d], i) => ({ label, d, fg: i === 3 ? '#5B8CFF' : '#7D8896' })),
buttons: [
b('Play / Pause', 'M8 5v14l11-7z', true),
b('Fullscreen', 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'),
b('Subtitles', 'M4 6h16v12H4zM8 12h3M13 12h3M8 15h8'),
b('Next episode', 'M6 5l9 7-9 7zM18 5v14'),
b('Skip intro', 'M5 12h14M13 6l6 6-6 6'),
b('Back', 'M10 6l-6 6 6 6M4 12h16')
]
};
}
}
</script>
</body>
</html>
