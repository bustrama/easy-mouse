<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone touchpad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&amp;display=swap">
<style>body{margin:0;font-family:'Heebo',system-ui,sans-serif}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1116;color:#F3F5F7;display:flex;flex-direction:column;padding:56px 16px 0">
<div style="display:flex;justify-content:space-between;align-items:center;height:44px">
<div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700"><span style="width:9px;height:9px;border-radius:50%;background:#4ADE80"></span>Office PC</div>
<button aria-label="Sensitivity settings" style="width:44px;height:44px;border-radius:14px;border:1px solid #2A323E;background:#171C24;display:flex;align-items:center;justify-content:center;padding:0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9D1DC" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</button>
</div>
<div style="margin-top:12px;flex:1;display:flex;gap:10px;min-height:0">
<div style="flex:1;border-radius:28px;background:#171C24;border:1px solid #2A323E;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">
<div>
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5B6572" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>
<div style="margin-top:12px;font-size:15px;color:#7D8896;line-height:1.5">Drag to move.<br>Tap to click. Two fingers to scroll.</div>
</div>
</div>
<div style="width:44px;border-radius:22px;background:#171C24;border:1px solid #2A323E;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7D8896" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
<div style="width:4px;height:60px;border-radius:2px;background:#2A323E"></div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7D8896" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</div>
</div>
<div style="margin-top:10px;display:flex;gap:10px;height:76px">
<button style="flex:1;border-radius:20px;border:1px solid #2A323E;background:#171C24;font:inherit;font-size:16px;font-weight:700;color:#F3F5F7">Left click</button>
<button style="flex:1;border-radius:20px;border:1px solid #2A323E;background:#171C24;font:inherit;font-size:16px;font-weight:700;color:#F3F5F7">Right click</button>
</div>
<div style="margin-top:14px;height:84px;border-top:1px solid #2A323E;display:flex;padding-top:8px;padding-bottom:20px;box-sizing:border-box">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:{{t.fg}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"/></svg>{{t.label}}
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const t = [
['Mouse', 'M12 3v18M3 12h18'],
['Keyboard', 'M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8'],
['Media', 'M8 5v14l11-7z'],
['Remotes', 'M4 6h16M4 12h16M4 18h10']
];
return { tabs: t.map(([label, d], i) => ({ label, d, fg: i === 0 ? '#5B8CFF' : '#7D8896' })) };
}
}
</script>
</body>
</html>
